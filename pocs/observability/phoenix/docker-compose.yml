services:
  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006" # Phoenix UI + OTLP HTTP /v1/traces
      - "4317:4317" # OTLP gRPC
      - "9090:9090" # Prometheus metrics when enabled
    environment:
      PHOENIX_PORT: "6006"
      PHOENIX_GRPC_PORT: "4317"
      PHOENIX_WORKING_DIR: /data
      PHOENIX_TELEMETRY_ENABLED: "false"
      PHOENIX_ENABLE_PROMETHEUS: "true"
      PHOENIX_ALLOW_EXTERNAL_RESOURCES: "false"
    volumes:
      - phoenix-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:6006/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  phoenix-app:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["seed"]
    environment:
      PHOENIX_PROJECT_NAME: ansu-phoenix-langchain-demo
      PHOENIX_OTEL_ENDPOINT: http://phoenix:6006/v1/traces
      DEMO_QUESTION: Quel est le besoin prioritaire du POC agentique AnSu v5 ?
      # Optional real providers:
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-mistral-small-latest}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    depends_on:
      phoenix:
        condition: service_healthy

  phoenix-dashboard:
    build:
      context: ./dashboard-next
      dockerfile: Dockerfile
    ports:
      - "3007:3007"
    environment:
      PHOENIX_BASE_URL: http://phoenix:6006
      DEFAULT_PHOENIX_PROJECT: ansu-phoenix-langchain-demo
    depends_on:
      phoenix:
        condition: service_healthy

volumes:
  phoenix-data:
