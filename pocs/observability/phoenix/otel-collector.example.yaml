# Example fan-out collector for production-like wiring:
# app -> OTel Collector -> Phoenix + Grafana Tempo
#
# Run this with an OpenTelemetry Collector image and adapt hostnames to your infra.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch: {}

exporters:
  otlphttp/phoenix:
    endpoint: http://phoenix:6006/v1/traces

  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/phoenix, otlp/tempo]
