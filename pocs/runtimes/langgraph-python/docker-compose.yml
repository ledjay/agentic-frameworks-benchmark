services:
  langgraph-runtime:
    build:
      context: .
    environment:
      ALBERT_API_KEY: ${ALBERT_API_KEY:-}
      ALBERT_BASE_URL: ${ALBERT_BASE_URL:-https://albert.api.etalab.gouv.fr/v1}
      ALBERT_MODEL: ${ALBERT_MODEL:-albert-large}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-mistral-small-latest}
      LANGGRAPH_PROVIDER: ${LANGGRAPH_PROVIDER:-albert}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-ansu-langgraph-runtime-dev}
    ports:
      - "3010:3010"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:3010/health').read()\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  langgraph-dashboard:
    build:
      context: ./dashboard-next
    environment:
      NODE_ENV: production
      LANGGRAPH_API_URL: http://langgraph-runtime:3010
      NEXT_BASE_URL: http://localhost:3011
    ports:
      - "3011:3011"
    depends_on:
      langgraph-runtime:
        condition: service_healthy
